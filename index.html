<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Inglês">
<meta name="description" content="Meu Inglês: estudo de inglês do zero, uma sessão por dia.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Meu Inglês</title>
<style>
:root{
  --bg:#0c0e13;--panel:#141821;--panel2:#1a1f2b;--line:#252b3a;--text:#e9ecf4;--muted:#8b93a7;
  --accent:#5ad1ff;--accent2:#8b6cff;--green:#34d399;--red:#ff6b7a;--yellow:#fbbf24;--radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Inter,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45;min-height:100vh;padding-top:env(safe-area-inset-top);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{cursor:default}
a{color:var(--accent)}
#app{max-width:560px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
body.foco #app{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
body.foco #tabs{display:none}
.top{margin:6px 2px 16px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:4px 0 6px}
h3{font-size:17px;font-weight:700;margin:2px 0 4px}
h2.sec{margin:22px 4px 10px;font-size:18px}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.center{text-align:center}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.row.c{justify-content:center;margin:10px 0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card.hero{background:linear-gradient(160deg,rgba(90,209,255,.14),rgba(139,108,255,.10) 60%,var(--panel));border-color:rgba(90,209,255,.35)}
.card.done{border-color:rgba(52,211,153,.4);background:linear-gradient(160deg,rgba(52,211,153,.12),var(--panel))}
.card.done svg{width:26px;height:26px;color:var(--green);flex:none}
.card.note{border-color:rgba(251,191,36,.4);background:linear-gradient(160deg,rgba(251,191,36,.10),var(--panel))}
.card.dimc{opacity:.75}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 16px;border-radius:14px;font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--accent),var(--green));color:#071016;margin-top:12px;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.good{background:var(--green);color:#06140e}
.btn.bad{background:rgba(255,107,122,.16);color:var(--red);border:1px solid rgba(255,107,122,.45)}
.btn.sm{width:auto;padding:10px 14px;margin-top:0;font-size:14px}
.btn:disabled{opacity:.45}
.btn.grow{margin-top:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--text);text-decoration:none}
.chip.danger{color:var(--red);border-color:rgba(255,107,122,.4)}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);flex:none}
.icon svg{width:20px;height:20px}
.icon.sm{width:34px;height:34px}.icon.sm svg{width:16px;height:16px}
.spk{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:rgba(90,209,255,.14);color:var(--accent);border:1px solid rgba(90,209,255,.35);flex:none;vertical-align:middle}
.spk svg{width:20px;height:20px}
.spk.lg{width:64px;height:64px}.spk.lg svg{width:30px;height:30px}
.spk:active{transform:scale(.94)}
.top .spk{width:34px;height:34px}.top .spk svg{width:17px;height:17px}
.inp{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;margin-top:10px;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--accent)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 12px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stats b{display:block;font-size:20px;font-weight:800}
.stats span{font-size:11.5px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,107,122,.14);color:var(--red)}
.exl{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exl:first-of-type{border-top:none}
.card .lbl + .exl{border-top:none}
.en{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.en.mid{font-size:26px;text-align:center;margin:8px 0}
.en.sm{font-size:16px;font-weight:700;letter-spacing:0}
.pt{font-size:18px;color:var(--muted);margin-top:6px}
.pt.big{font-size:22px;color:var(--text);font-weight:700;text-align:center;margin:10px 0 14px}
.tip{margin:12px 0 6px;padding:10px 12px;border-radius:12px;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.3);font-size:14px}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-top:10px;text-decoration:none}
.mini svg{width:14px;height:14px}
.cardbig{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 18px;margin:12px 0;text-align:center}
.cardbig .lbl{margin-bottom:12px}
.shead{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.steps{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.st{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.st svg{width:13px;height:13px}
.st.done{color:var(--green);border-color:rgba(52,211,153,.4)}
.st.cur{color:var(--text);border-color:var(--accent);background:rgba(90,209,255,.12)}
.sub{color:var(--muted);font-size:14px;margin:-4px 2px 8px}
.pbar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:4px 0 6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px;transition:width .3s}
.q{text-align:center;margin:14px 0 6px}
.enun{font-size:20px;font-weight:700;text-align:center;margin:10px 0 14px}
.lac{color:var(--accent)}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;margin:9px 0;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-size:16.5px;font-weight:600;transition:border-color .15s,background .15s}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.ok{border-color:var(--green);background:rgba(52,211,153,.14)}
.opt.err{border-color:var(--red);background:rgba(255,107,122,.14)}
.opt.dim{opacity:.5}
.linha{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 4px;border-bottom:2px dashed var(--line);margin-bottom:14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:10px 13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px;font-weight:700;font-size:16px}
.tile.used{opacity:.25}
.fb{margin-top:14px;padding:14px;border-radius:16px;border:1px solid}
.fb.ok{background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.45)}
.fb.err{background:rgba(255,107,122,.10);border-color:rgba(255,107,122,.45)}
.fb > b{font-size:17px}
.fb.ok > b{color:var(--green)}.fb.err > b{color:var(--red)}
.fb .certo{font-size:19px;font-weight:800;margin:6px 0}
.fb .why{margin:8px 0;font-size:14.5px}
.fb > div{margin-top:6px}
.fb .row{margin-top:12px}
mark{background:rgba(255,107,122,.25);color:var(--text);border-radius:4px;padding:0 3px}
.score{font-size:46px;font-weight:900;line-height:1.1;margin-top:4px}
.score small{font-size:22px;color:var(--muted)}
.errl{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.card .lbl + .errl{border-top:none}
.bad-t{color:var(--red)}.good-t{color:var(--green)}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.card .lbl + .srow{border-top:none}
.srow .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--panel2);border:1px solid var(--line);color:var(--muted);flex:none}
.srow .dot svg{width:15px;height:15px}
.srow.ok .dot{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.5);color:var(--green)}
.srow.now .dot{background:rgba(90,209,255,.16);border-color:var(--accent);color:var(--accent)}
.bonus{display:flex;flex-direction:column;gap:2px;padding:10px 12px;margin:8px 0;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;color:var(--text)}
.bonus b{display:flex;align-items:center;gap:6px;font-size:15px}
.bonus svg{width:14px;height:14px;color:var(--accent);flex:none}
.bonus.sm{flex-direction:row;align-items:center;gap:6px;font-size:14px;padding:8px 10px}
.forca{display:inline-flex;gap:3px;flex:none}
.forca i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.forca i.on{background:var(--green)}
.sw{display:flex;align-items:center;gap:12px;font-weight:600}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(17,20,28,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10.5px;font-weight:600}
#tabs button svg{width:23px;height:23px}
#tabs button.on{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#232a3a;border:1px solid var(--line);color:var(--text);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---- v2: progresso e gamificação ---- */
body.travado{overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(90,209,255,.1)}
.chipbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700;cursor:pointer}
.pill svg{width:15px;height:15px}
.pill.fire{color:var(--yellow);border-color:rgba(251,191,36,.35)}
.pill.lvl{color:var(--accent2);border-color:rgba(139,108,255,.4)}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;margin-top:6px}
.week span{font-size:11.5px;color:var(--muted)}
.wd{width:40px;height:40px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--line);color:var(--muted)}
.wd svg{width:18px;height:18px}
.wd.ok{background:rgba(52,211,153,.18);border-color:var(--green);color:var(--green)}
.wd.now{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px rgba(90,209,255,.16)}
.wd.miss{border-style:dashed}
.anel{flex:none}
.mtag{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:700;color:var(--yellow)}
.mtag svg{width:15px;height:15px}
.xpchip{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:rgba(139,108,255,.18);color:#b9a6ff}
.xpchip.big{font-size:13px;padding:6px 10px}
.prow{display:flex;justify-content:space-between;align-items:center;min-height:26px}
.combo{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--yellow)}
.combo svg{width:15px;height:15px}
.combo.flash{animation:pulso .6s ease-out 2}
@keyframes pulso{50%{transform:scale(1.25)}}
.comboban{text-align:center;font-weight:900;font-size:18px;color:var(--yellow);margin:4px 0;animation:sobe .7s ease-out}
@keyframes sobe{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.card.mission{border-color:rgba(251,191,36,.45);background:linear-gradient(160deg,rgba(251,191,36,.12),var(--panel))}
.card.mission .lbl{display:flex;align-items:center;gap:6px;color:var(--yellow)}
.card.mission .lbl svg{width:14px;height:14px}
textarea.area{min-height:150px;resize:vertical;line-height:1.5}
.mcount{font-weight:800;margin-bottom:6px;color:var(--muted)}
.mcount.ok{color:var(--green)}
.mchk{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14.5px;color:var(--muted)}
.mchk span{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.mchk span svg{width:13px;height:13px}
.mchk.ok{color:var(--text)}
.mchk.ok span{background:var(--green);border-color:var(--green);color:#06140e}
.mapa{position:relative;margin:10px 0 4px}
.trilho{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;display:flex;align-items:center;gap:10px;text-align:left;max-width:78%}
.bola{position:relative;width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:17px;background:var(--panel2);border:3px solid var(--line);color:var(--muted);border-bottom-width:6px}
.bola svg{width:22px;height:22px}
.node.ok .bola{background:rgba(52,211,153,.2);border-color:var(--green);color:var(--green)}
.node.now .bola{background:rgba(90,209,255,.2);border-color:var(--accent);color:var(--accent);animation:brilho 1.8s ease-in-out infinite}
@keyframes brilho{50%{box-shadow:0 0 0 8px rgba(90,209,255,.14)}}
.node.lock{opacity:.6}
.star{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--yellow);color:#1a1300;display:grid;place-items:center}
.star svg{width:13px;height:13px}
.nl{display:flex;flex-direction:column;min-width:0}
.nl b{font-size:14.5px;line-height:1.25}
.nl small{font-size:12px;color:var(--muted)}
.node.now .nl small{color:var(--accent);font-weight:700}
h2.sec svg{width:18px;height:18px;vertical-align:-3px;margin-right:4px}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line)}
.card .lbl + .lrow{border-top:none}
.lrow svg{width:16px;height:16px;color:var(--muted);flex:none}
.lockc{display:flex;gap:12px;align-items:flex-start}
.lockc > svg{width:22px;height:22px;color:var(--muted);flex:none;margin-top:2px}
.lvlbadge{width:62px;height:62px;flex:none;border-radius:18px;display:grid;place-items:center;font-size:28px;font-weight:900;color:#0c0e13;background:linear-gradient(135deg,var(--accent2),var(--accent))}
.card .row .pbar{margin:8px 0 4px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hl{font-size:11px;color:var(--muted);text-align:center}
.hc{display:block;height:24px;border-radius:6px;background:var(--panel2)}
.hc.n1{background:rgba(90,209,255,.35)}.hc.n2{background:rgba(90,209,255,.65)}.hc.n3{background:var(--accent)}
.hc.fut{background:transparent;border:1px dashed var(--line)}
.hc.hj{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.legend .hc{width:12px;height:12px;display:inline-block;aspect-ratio:auto;border-radius:3px}
.linha-g{width:100%;height:auto;display:block}
.sk{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.pbar.thin{height:7px;margin:0}
.pbar i.w{background:linear-gradient(90deg,var(--yellow),#f59e0b)}
.pbar i.g{background:var(--green)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.badges.mini{grid-template-columns:1fr}
.badges.mini .badge{display:grid;grid-template-columns:34px 1fr;column-gap:12px;align-items:center;padding:10px 12px}
.badges.mini .bi{grid-row:span 2;margin:0}
.badge{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);opacity:.55}
.badge .bi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);margin-bottom:4px}
.badge .bi svg{width:19px;height:19px}
.badge b{font-size:14px}
.badge small{font-size:12px;color:var(--muted)}
.badge.ok{opacity:1;border-color:rgba(251,191,36,.45);background:linear-gradient(160deg,rgba(251,191,36,.1),var(--panel))}
.badge.ok .bi{background:var(--yellow);color:#1a1300}
.badge.pop{animation:sobe .6s ease-out}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:10px 0 8px;background:var(--panel2)}
.stack .s1,.dotc.s1{background:var(--green)}.stack .s2,.dotc.s2{background:var(--accent)}.stack .s3,.dotc.s3{background:#3a4256}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.card.grp{padding:4px 16px}
.ghead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 0}
.gbar{width:70px;flex:none}
.wbtn{text-align:left}
.addw{width:50px;height:50px;margin-top:10px;color:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(5,7,10,.62);z-index:30;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:86vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));z-index:31;animation:subir .25s ease-out}
@keyframes subir{from{transform:translateY(40px);opacity:.5}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.fechar{position:absolute;right:14px;top:12px}
.sheet .en{margin:6px 0}
.modalov{display:grid;place-items:center;padding:20px;overflow:auto}
.modal{position:relative;z-index:2;width:100%;max-width:420px;background:var(--panel);border:1px solid rgba(90,209,255,.35);border-radius:24px;padding:22px 18px;text-align:center;animation:sobe .45s ease-out}
.modal .badges{text-align:left}
.bigxp{font-size:46px;font-weight:900;margin:6px 0 12px;background:linear-gradient(135deg,#b9a6ff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.dest{display:flex;flex-direction:column;gap:6px;margin:4px 0 14px}
.dest div{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;color:var(--yellow)}
.dest svg{width:16px;height:16px}
.confete{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.confete i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation-name:cai;animation-timing-function:ease-in;animation-fill-mode:forwards}
@keyframes cai{to{top:105%;transform:rotate(540deg) translateX(30px)}}
.pre{white-space:pre-wrap}
@media (min-width:700px){#app{padding-top:34px}}
</style>
</head>
<body>
<div id="app"><p class="muted" style="padding:40px 0;text-align:center">Carregando...</p></div>
<nav id="tabs"></nav>
<div id="toast"></div>
<noscript><p style="padding:20px">Ative o JavaScript para usar o Meu Inglês.</p></noscript>
<script src="conteudo.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
